name: Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-windows.yml

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build And Publish Windows
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $cfg = Get-Content -Path wails.json -Raw | ConvertFrom-Json
          $version = $cfg.info.productVersion
          if (-not ($version -match '^\d+\.\d+\.\d+$')) {
            throw "Invalid productVersion in wails.json: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Normalize npm registry for CI
        shell: pwsh
        run: |
          $path = "frontend/package-lock.json"
          $before = Get-Content -Path $path -Raw
          $after = $before.Replace("https://registry.npmmirror.com/", "https://registry.npmjs.org/")
          if ($before -ne $after) {
            Set-Content -Path $path -Value $after -NoNewline
          }

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --no-audit --fund=false

      - name: Build frontend assets
        working-directory: frontend
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm run build

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          $goBin = Join-Path (go env GOPATH) "bin"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows app
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.appVersion=$env:APP_VERSION"

      - name: Package Windows asset
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $assetName = "CodexSwitch-$env:APP_VERSION-windows-amd64.zip"
          Compress-Archive -Path build/bin/* -DestinationPath "release-assets/$assetName" -Force

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $asset = Get-ChildItem -Path release-assets -File | Select-Object -First 1
          if (-not $asset) {
            throw "No Windows release asset was packaged."
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset.FullName --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset.FullName `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TAG `
              --notes "Windows amd64 preview release."
          }
